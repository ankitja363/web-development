<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a Page</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7;
  }
  .card {
    background: #fff;
    padding: 48px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 90%;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #1a1a2e;
  }
  p {
    margin: 0 0 28px;
    color: #666;
    font-size: 14px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.btn {
    display: block;
    padding: 14px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.btn:hover {
    transform: translateY(-2px);
  }
  .btn-kiwa {
    background: #4361ee;
    color: #fff;
  }
  .btn-realstate {
    background: #2a9d8f;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Where would you like to go?</h1>
    <p>Select a page to continue</p>
    <div class="links">
      <a class="btn btn-kiwa" href="kiwa.html">Go to Kiwa</a>
      <a class="btn btn-realstate" href="real-estate.html">Go to Real Estate</a>
    </div>
  </div>
</body>
</html>
